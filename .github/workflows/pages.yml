name: pages

# Deploy the interactive playground (index.html + demo.svg) and the
# coverage badge payload (coverage.json) to GitHub Pages.
# Live at https://asunachi.github.io/git-cleanup/
#
# Runs on:
#   - every release tag (v*) — the live playground always mirrors the latest
#     published release,
#   - every push to main (unreleased engine changes preview there too), and
#   - manual workflow_dispatch.
#
# Before deploying, the committed index.html is regenerated from
# src/engine.mjs (npm run sync:playground) and verified byte-identical to
# what is committed — the same freshness gate CI enforces on every PR — so a
# stale page can never be published. The test suite then runs again under
# Node's built-in coverage reporter (npm run coverage): the suite must pass
# and the coverage badge payload is written to coverage.json, which the site
# serves for the README badge. The badge therefore always describes exactly
# the tree this deploy publishes, and a broken tree can never be published.
#
# One-time setup: GitHub repo Settings → Pages → Source: "GitHub Actions".
# Pages then needs no branch; each run publishes the _site artifact.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild + verify the committed playground bundle
        shell: bash
        run: |
          npm run sync:playground
          if ! git diff --exit-code --quiet -- index.html; then
            echo "::error::index.html is out of sync with src/engine.mjs — run 'npm run sync:playground' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi
          echo "playground bundle verified in sync with src/engine.mjs"

      - name: Run the suite under coverage and write the badge payload
        shell: bash
        run: npm run coverage

      - name: Stage the site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp demo.svg _site/
          cp coverage.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
