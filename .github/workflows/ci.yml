name: CI

on:
  push:
  pull_request:
  # Nightly deep sweep: the parity fuzz runs at 50,000 shapes (FUZZ_CASES)
  # so the engine/page-bundle space is re-swept even on days with no pushes.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Cancel outdated runs for the same branch so quick pushes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run the test suite
        # bash so the suite behaves identically on every OS (Git Bash on
        # Windows runners; `npm test` spawns git itself, never a shell).
        shell: bash
        # High-volume parity fuzz in CI; local `npm test` stays at the fast
        # 2,000-shape default. Raise further via FUZZ_CASES in a manual
        # workflow_dispatch, and add FUZZ_SEED to sweep different space.
        env:
          FUZZ_CASES: "50000"
        run: npm test

      - name: Smoke-check the CLI
        shell: bash
        run: |
          node bin/git-cleanup.mjs --version
          node bin/git-cleanup.mjs --help >/dev/null
          # Scanning a missing path must fail cleanly (exit 1).
          if node bin/git-cleanup.mjs scan --repo /nonexistent >/dev/null 2>&1; then
            echo "expected scan to fail on a missing repo" >&2
            exit 1
          fi

  # The playground page bundles src/engine.mjs between __ENGINE__ markers via
  # `npm run sync:playground`. This is a content-identity check (engine change
  # => page copy must change in the same commit), so it runs once on Linux
  # rather than on every OS: it reads and rewrites the file, which makes it
  # sensitive to checkout line-ending conversion on Windows runners.
  playground-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bundled playground engine must be committed in sync
        shell: bash
        run: |
          npm run sync:playground
          if ! git diff --exit-code --quiet -- index.html; then
            echo "::error::index.html is out of sync with src/engine.mjs — run 'npm run sync:playground' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi
          echo "playground bundle is in sync with src/engine.mjs"