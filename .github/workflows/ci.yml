name: CI

on:
  push:
  pull_request:

# Cancel outdated runs for the same branch so quick pushes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run the test suite
        # bash so the suite behaves identically on every OS (Git Bash on
        # Windows runners; `npm test` spawns git itself, never a shell).
        shell: bash
        run: npm test

      - name: Smoke-check the CLI
        shell: bash
        run: |
          node bin/git-cleanup.mjs --version
          node bin/git-cleanup.mjs --help >/dev/null
          # Scanning a missing path must fail cleanly (exit 1).
          if node bin/git-cleanup.mjs scan --repo /nonexistent >/dev/null 2>&1; then
            echo "expected scan to fail on a missing repo" >&2
            exit 1
          fi